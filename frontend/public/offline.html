<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hors connexion — Maison Hafrose</title>
    <meta name="theme-color" content="#111111" />
    <style>
      :root {
        --bg-color: #FDFBF7;
        --text-charcoal: #111111;
        --text-gold: #D4AF37;
        --text-gray: #666666;
        --border-beige: #EBE5DF;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-charcoal);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem 1.5rem;
      }
      .brand {
        font-size: 10px;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        color: var(--text-gold);
        font-weight: 600;
        margin-bottom: 1.5rem;
      }
      .title {
        font-family: "Cormorant Garamond", "Playfair Display", Georgia, serif;
        font-size: 2rem;
        font-weight: 300;
        margin-bottom: 1rem;
      }
      .line {
        width: 40px;
        height: 1px;
        background-color: var(--text-gold);
        margin: 1rem auto;
      }
      .desc {
        font-size: 0.85rem;
        color: var(--text-gray);
        line-height: 1.6;
        max-width: 360px;
        margin-bottom: 2rem;
      }
      .btn {
        display: inline-block;
        padding: 0.85rem 2rem;
        background-color: var(--text-charcoal);
        color: #FFFFFF;
        text-decoration: none;
        font-size: 10px;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        border: none;
        cursor: pointer;
        transition: opacity 0.3s;
      }
      .btn:hover { opacity: 0.9; }
    </style>
  </head>
  <body>
    <div class="brand">Maison Hafrose</div>
    <h1 class="title">Hors Connexion</h1>
    <div class="line"></div>
    <p class="desc">
      Vous n'êtes actuellement pas connecté à Internet. Vos pièces favorites et votre sélection restent accessibles dès votre rétablissement du réseau.
    </p>
    <button class="btn" onclick="window.location.reload()">Réessayer</button>
  </body>
</html>
