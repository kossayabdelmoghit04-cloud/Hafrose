# ==============================================================================
# HAFROSE Backend - Nginx Server Configuration (Production / Ubuntu 24.04 LTS)
# ==============================================================================
# Domain: hafrose.com / api.hafrose.com
# Stack: Nginx 1.24+ | PHP 8.3-FPM | SSL (Let's Encrypt) | HTTP/2
# ==============================================================================

# FastCGI Cache Configuration (Active outside server block)
# Allocated 100MB shared memory zone 'HAFROSE_CACHE' capable of storing ~800,000 keys.
# Inactive items purged after 60m. Max disk storage size capped at 1GB.
fastcgi_cache_path /var/cache/nginx/hafrose levels=1:2 keys_zone=HAFROSE_CACHE:100m inactive=60m max_size=1g;
fastcgi_cache_key "$scheme$request_method$host$request_uri";
fastcgi_cache_use_stale error timeout invalid_header updating http_500 http_503;
fastcgi_ignore_headers Cache-Control Expires Set-Cookie;

# ------------------------------------------------------------------------------
# HTTP Server Block — Mandatory 301 Redirect to HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name hafrose.com www.hafrose.com api.hafrose.com;

    # Let's Encrypt Certbot ACME Challenge location
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/hafrose/backend/public;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# HTTPS Server Block — Secure Production Environment
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hafrose.com www.hafrose.com api.hafrose.com;

    # Document Root (Laravel Public Folder)
    root /var/www/hafrose/backend/public;
    index index.php index.html;

    # --------------------------------------------------------------------------
    # SSL / TLS Security Configuration (Let's Encrypt & Modern Standards)
    # --------------------------------------------------------------------------
    ssl_certificate /etc/letsencrypt/live/hafrose.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hafrose.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/hafrose.com/chain.pem;

    # SSL Protocols & Ciphers (Mozilla Modern/Intermediate Standard)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL Session Optimization
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # OCSP Stapling (Improves TLS handshake speed and privacy)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # --------------------------------------------------------------------------
    # Request Limits & Timeouts
    # --------------------------------------------------------------------------
    client_max_body_size 20M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    keepalive_timeout 65;
    keepalive_requests 100;
    send_timeout 60;
    client_body_timeout 60;
    client_header_timeout 60;

    # --------------------------------------------------------------------------
    # Security Headers (Defense in Depth)
    # --------------------------------------------------------------------------
    # HTTP Strict Transport Security (HSTS) - Force HTTPS for 1 year including subdomains
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # Prevent clickjacking attacks by disallowing framing outside same origin
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevent MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Enable browser XSS filtering
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer Policy to limit referrer info leakage
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Content Security Policy (CSP) for API/Backend application
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'; frame-ancestors 'self';" always;

    # Permissions Policy restricting unused browser features
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Remove Nginx version number from response headers
    server_tokens off;

    # --------------------------------------------------------------------------
    # Compression Settings (Gzip & Brotli)
    # --------------------------------------------------------------------------
    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Brotli Compression (Uncomment if ngx_brotli module is installed)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # --------------------------------------------------------------------------
    # Logging Configuration
    # --------------------------------------------------------------------------
    access_log /var/log/nginx/hafrose_access.log;
    error_log /var/log/nginx/hafrose_error.log warn;

    # --------------------------------------------------------------------------
    # Application Routing (Laravel Front Controller Pattern)
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Custom Error Pages
    error_page 404 /index.php;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/hafrose/backend/public;
    }

    # --------------------------------------------------------------------------
    # PHP-FPM FastCGI Handler
    # --------------------------------------------------------------------------
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_index index.php;
        
        # FastCGI Buffer and Timeout Settings
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 180s;
        fastcgi_read_timeout 180s;

        # Mandatory FastCGI Parameters
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY ""; # Mitigate HTTPoxy vulnerability

        # FastCGI Caching Rules for Public GET requests (bypassed for authenticated API requests)
        # fastcgi_cache HAFROSE_CACHE;
        # fastcgi_cache_valid 200 60m;
        # fastcgi_cache_bypass $http_authorization $cookie_laravel_session;
        # fastcgi_no_cache $http_authorization $cookie_laravel_session;
        # add_header X-FastCGI-Cache $upstream_cache_status;
    }

    # --------------------------------------------------------------------------
    # Static Assets Caching & Performance
    # --------------------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # Favicon and Robots handling
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # --------------------------------------------------------------------------
    # Sensitive Files & Hidden Files Security Restrictions
    # --------------------------------------------------------------------------
    # Deny access to hidden files (.env, .git, .htaccess, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny direct access to application metadata, lock files, and configurations
    location ~* \.(env|example|json|lock|yml|yaml|md|sql|log|sh|conf)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block direct access to storage logs and backups
    location ^~ /storage/logs/ {
        deny all;
        return 404;
    }

    # Block direct access to vendor directory
    location ^~ /vendor/ {
        deny all;
        return 404;
    }
}
