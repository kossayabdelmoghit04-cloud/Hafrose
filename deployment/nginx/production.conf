server {
    listen 80;
    server_name hafrose.com www.hafrose.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hafrose.com www.hafrose.com;

    # SSL
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Client max upload size
    client_max_body_size 20M;

    # Rate limiting zone (defined globally in nginx.conf)
    # limit_req zone=api burst=20 nodelay;

    # ── Laravel API Backend ──────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:9000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # No caching for API responses
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── Laravel Storage (uploaded files) ────────────────────────────────────
    location /storage/ {
        proxy_pass         http://backend:9000;
        proxy_set_header   Host $host;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ── React SPA Frontend ───────────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend:80;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Logging ──────────────────────────────────────────────────────────────
    access_log  /var/log/nginx/hafrose_access.log;
    error_log   /var/log/nginx/hafrose_error.log warn;
}
