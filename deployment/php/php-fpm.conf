; ==============================================================================
; HAFROSE Backend — PHP 8.3-FPM Production Pool Configuration
; ==============================================================================
; Target OS: Ubuntu 24.04 LTS
; Target Path: /etc/php/8.3/fpm/pool.d/hafrose.conf (or php-fpm.conf inclusion)
; ==============================================================================

[hafrose]

; ------------------------------------------------------------------------------
; Process Manager & User Context
; ------------------------------------------------------------------------------
; Unix user and group under which PHP-FPM worker processes will run.
user = www-data
group = www-data

; Unix socket address on which PHP-FPM listens for Nginx requests.
listen = /var/run/php/php8.3-fpm.sock

; Socket permissions allowing Nginx (www-data) to read/write to the socket.
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; ------------------------------------------------------------------------------
; Process Manager (PM) Tuning — High Performance Dynamic Pool
; ------------------------------------------------------------------------------
; Control mode: 'dynamic' dynamically scales workers based on real-time API load.
pm = dynamic

; Absolute maximum number of child processes allowed to be created.
; Calculated based on server RAM: (Available RAM for PHP e.g. 4GB) / (Avg PHP RAM per request e.g. 60MB) ≈ 50-60 workers.
pm.max_children = 50

; Number of child processes created on PHP-FPM startup.
; Set to 10 to instantly process incoming baseline request spikes after deployment.
pm.start_servers = 10

; Minimum number of idle (spare) child processes maintained during low-traffic periods.
; Guarantees immediate response capability for new connections without spawn latency.
pm.min_spare_servers = 5

; Maximum number of idle (spare) child processes allowed to exist.
; Prevents excessive RAM consumption during traffic lulls by reaping idle workers above 20.
pm.max_spare_servers = 20

; Number of requests each worker process serves before recycling itself.
; Helps eliminate potential third-party library memory leaks over long runtimes.
pm.max_requests = 1000

; Timeout for serving a request before killing the worker process (seconds).
request_terminate_timeout = 60s

; Slow log path to capture requests taking longer than request_slowlog_timeout.
slowlog = /var/log/php8.3-fpm-hafrose-slow.log
request_slowlog_timeout = 5s

; ------------------------------------------------------------------------------
; Environment & PHP INI Directive Overrides (PHP 8.3+)
; ------------------------------------------------------------------------------

; Memory & Execution Limits
; -------------------------
; Maximum amount of memory a single PHP request script may consume.
php_admin_value[memory_limit] = 512M

; Maximum execution time of each script, in seconds (prevents runaway requests).
php_admin_value[max_execution_time] = 60

; Maximum time in seconds a script is allowed to parse input data (POST, GET, files).
php_admin_value[max_input_time] = 60

; Maximum nesting level of input variables (prevents hash collisions).
php_admin_value[max_input_vars] = 3000

; File Upload & POST Body Restrictions
; ------------------------------------
; Maximum allowed size for uploaded files via multipart/form-data.
php_admin_value[upload_max_filesize] = 20M

; Maximum size of POST data that PHP will accept. Must be greater than upload_max_filesize.
php_admin_value[post_max_size] = 25M

; Path where uploaded files are held temporarily.
php_admin_value[upload_tmp_dir] = /tmp

; File System & Realpath Cache Optimization
; -----------------------------------------
; Size of the realpath cache used by PHP to cache resolved file paths.
; Dramatically reduces disk I/O and stat() calls across Laravel framework file loading.
php_admin_value[realpath_cache_size] = 4096k

; Duration (in seconds) for which resolved path information is cached.
php_admin_value[realpath_cache_ttl] = 600

; Security & Error Handling Defaults
; -----------------------------------
; Disable displaying errors in production HTTP responses to prevent code leaks.
php_admin_flag[display_errors] = off
php_admin_flag[display_startup_errors] = off

; Enable error logging to specified log destination.
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php8.3-fpm-hafrose-error.log

; Hide PHP header identification (X-Powered-By).
php_admin_flag[expose_php] = off

; OPcache High-Performance Engine Tuning
; --------------------------------------
; Enable OPcache bytecode caching in CLI and FPM environments.
php_admin_flag[opcache.enable] = on

; Shared memory storage allocation for compiled PHP bytecode (in Megabytes).
php_admin_value[opcache.memory_consumption] = 256

; Amount of memory for interned strings (e.g. class names, string literals) in MB.
php_admin_value[opcache.interned_strings_buffer] = 16

; Maximum number of PHP scripts that can be stored in the OPcache hash table.
; Higher than total files in Laravel + vendor packages (~15,000 files).
php_admin_value[opcache.max_accelerated_files] = 20000

; Disable timestamp validation in production to eliminate stat() file system overhead.
; Deployment scripts must explicitly flush OPcache (`php artisan opcache:clear` or FPM reload).
php_admin_flag[opcache.validate_timestamps] = off
php_admin_value[opcache.revalidate_freq] = 0

; Preserve code comments in bytecode (essential for Reflection, Doctrine, & PHP Attributes).
php_admin_flag[opcache.save_comments] = on

; Fast shutdown sequence for OPcache code unload.
php_admin_flag[opcache.fast_shutdown] = on

; Enable Just-In-Time (JIT) Compiler for PHP 8.3+ CPU performance.
php_admin_value[opcache.jit] = tracing
php_admin_value[opcache.jit_buffer_size] = 128M
