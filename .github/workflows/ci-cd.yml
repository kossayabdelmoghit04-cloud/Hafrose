name: HAFROSE CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'release/*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # ── 1. Frontend Quality & Build ────────────────────────────────────────────
  frontend-ci:
    name: Frontend Typecheck, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run TypeScript Check
        working-directory: ./frontend
        run: npm run typecheck

      - name: Run ESLint Linter
        working-directory: ./frontend
        run: npm run lint

      - name: Verify Production Build
        working-directory: ./frontend
        run: npm run build

  # ── 2. Backend Quality & Tests ─────────────────────────────────────────────
  backend-ci:
    name: Backend Lint, Static Analysis & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, pdo_sqlite, zip, gd, bcmath, ctype, json, xml, redis
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-8.3-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            composer-8.3-
            composer-

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Run Pint Code Style Check
        working-directory: ./backend
        run: composer lint:test

      - name: Prepare CI environment
        working-directory: ./backend
        run: |
          cp .env.ci .env
          touch database/database.sqlite

      - name: Generate APP_KEY
        working-directory: ./backend
        run: php artisan key:generate --force

      - name: Run database migrations
        working-directory: ./backend
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/backend/database/database.sqlite
        run: php artisan migrate --force

      - name: Clear application caches
        working-directory: ./backend
        run: |
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear

      - name: Execute PHPUnit Tests
        working-directory: ./backend
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/backend/database/database.sqlite
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
          SESSION_DRIVER: array
          TURNSTILE_ENABLED: false
          HONEYPOT_ENABLED: false
          MONITORING_ENABLED: false
        run: php artisan test --colors=always

  # ── 3. Production Deployment Trigger (main branch only) ───────────────────
  deploy-production:
    name: Deploy to Production
    needs: [frontend-ci, backend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        # Required secrets in GitHub → Settings → Secrets:
        #   PROD_SERVER_IP    → IP/hostname of the production server
        #   PROD_SERVER_USER  → SSH user (e.g. deploy)
        #   PROD_SSH_PRIVATE_KEY → SSH private key for authentication
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/hafrose
            git pull origin main
            docker-compose -f docker-compose.yml up -d --build
            docker exec hafrose_backend php artisan migrate --force
            docker exec hafrose_backend php artisan config:cache
            docker exec hafrose_backend php artisan route:cache
            docker exec hafrose_backend php artisan view:cache
