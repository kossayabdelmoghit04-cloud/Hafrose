name: HAFROSE CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'release/*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ── 1. Frontend Quality & Tests ─────────────────────────────────────────────
  frontend-ci:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Oxlint Linter
        working-directory: ./frontend
        run: npm run lint

      - name: Run Vitest Unit & Component Tests
        working-directory: ./frontend
        run: npm run test

      - name: Verify Production Build
        working-directory: ./frontend
        run: npm run build

  # ── 2. Backend Quality & Tests ──────────────────────────────────────────────
  backend-ci:
    name: Backend Lint, Static Analysis & Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: hafrose_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, zip, gd
          coverage: xdebug

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run Pint Code Style Test
        working-directory: ./backend
        run: composer lint:test

      - name: Prepare Database & Run PHPUnit Tests
        working-directory: ./backend
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: hafrose_test
          DB_USERNAME: root
          DB_PASSWORD: root
          APP_ENV: testing
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
          php artisan test

  # ── 3. Production Deployment Trigger (main branch only) ────────────────────
  deploy-production:
    name: Deploy to Production
    needs: [frontend-ci, backend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/hafrose
            git pull origin main
            docker-compose -f docker-compose.yml up -d --build
            docker exec hafrose_backend php artisan migrate --force
            docker exec hafrose_backend php artisan config:cache
            docker exec hafrose_backend php artisan route:cache
            docker exec hafrose_backend php artisan view:cache
