name: HAFROSE CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'release/*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # ── 1. Frontend Quality & Build ────────────────────────────────────────────
  frontend-ci:
    name: Frontend Typecheck, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run TypeScript Check
        working-directory: ./frontend
        run: npm run typecheck

      - name: Run ESLint Linter
        working-directory: ./frontend
        run: npm run lint

      - name: Verify Production Build
        working-directory: ./frontend
        run: npm run build

  # ── 2. Backend Quality & Tests ─────────────────────────────────────────────
  backend-ci:
    name: Backend Lint, Static Analysis & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, pdo_sqlite, zip, gd, bcmath, ctype, json, xml, redis
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-8.3-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            composer-8.3-
            composer-

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Run Pint Code Style Check
        working-directory: ./backend
        run: composer lint:test

      - name: Prepare CI environment
        working-directory: ./backend
        run: |
          cp .env.ci .env
          touch database/database.sqlite

      - name: Generate APP_KEY
        working-directory: ./backend
        run: php artisan key:generate --force

      - name: Run database migrations
        working-directory: ./backend
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/backend/database/database.sqlite
        run: php artisan migrate --force

      - name: Clear application caches
        working-directory: ./backend
        run: |
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear

      - name: Execute PHPUnit Tests
        working-directory: ./backend
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/backend/database/database.sqlite
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
          SESSION_DRIVER: array
          TURNSTILE_ENABLED: false
          HONEYPOT_ENABLED: false
          MONITORING_ENABLED: false
        run: php artisan test --colors=always

  # ── 3. Security & Vulnerability Checks ─────────────────────────────────────
  security-checks:
    name: Security & Secret Audits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Audit Repository for Tracked Sensitive Files
        run: |
          echo "=== Scanning for accidentally committed sensitive files ==="
          FAILED=0
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "❌ CRITICAL: Root .env is tracked by git!"
            FAILED=1
          fi
          if git ls-files --error-unmatch backend/.env 2>/dev/null; then
            echo "❌ CRITICAL: backend/.env is tracked by git!"
            FAILED=1
          fi
          if git ls-files --error-unmatch frontend/.env 2>/dev/null; then
            echo "❌ CRITICAL: frontend/.env is tracked by git!"
            FAILED=1
          fi
          if [ $FAILED -ne 0 ]; then
            exit 1
          fi
          echo "✅ No sensitive .env files are tracked."

      - name: Setup Node.js for Security Audit
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Run Frontend NPM Audit
        working-directory: ./frontend
        run: npm audit --audit-level=high

      - name: Setup PHP for Composer Security Audit
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json
          coverage: none

      - name: Validate Composer Configuration
        working-directory: ./backend
        run: composer validate --strict

      - name: Run Backend Composer Audit
        working-directory: ./backend
        run: composer audit --no-dev

  # ── 4. Production Deployment Trigger (main branch only) ───────────────────
  deploy-production:
    name: Deploy to Production
    needs: [frontend-ci, backend-ci, security-checks]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Production Deployment Guards
        id: deploy-guard
        run: |
          echo "=== Auditing Production Deployment Prerequisites ==="
          if [ -z "${{ secrets.PROD_SERVER_IP }}" ] || [ -z "${{ secrets.PROD_SERVER_USER }}" ] || [ -z "${{ secrets.PROD_SSH_PRIVATE_KEY }}" ]; then
            echo "::warning title=Deployment Guard::DEPLOYMENT BLOCKED — PRODUCTION SECRETS NOT CONFIGURED"
            echo "Production secrets (PROD_SERVER_IP, PROD_SERVER_USER, PROD_SSH_PRIVATE_KEY) are not configured."
            echo "Automatic deployment aborted safely. Pipeline validation successful."
            echo "can_deploy=false" >> $GITHUB_OUTPUT
          else
            echo "Production secrets detected. Ready for deployment."
            echo "can_deploy=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via SSH
        if: steps.deploy-guard.outputs.can_deploy == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/hafrose
            git pull origin main
            docker-compose -f docker-compose.yml up -d --build
            docker exec hafrose_backend php artisan migrate --force
            docker exec hafrose_backend php artisan config:cache
            docker exec hafrose_backend php artisan route:cache
            docker exec hafrose_backend php artisan view:cache
