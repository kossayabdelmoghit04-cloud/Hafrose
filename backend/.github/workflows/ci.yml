name: 🚀 CI — HAFROSE Backend

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1 — Tests & Build
  # ─────────────────────────────────────────────────────────────────────────────
  tests:
    name: 🧪 Tests PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.3"]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Setup PHP ─────────────────────────────────────────────────────────
      - name: 🐘 Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: >-
            mbstring, pdo_mysql, pdo_sqlite, openssl, gd, zip,
            redis, bcmath, ctype, json, xml, intl, curl, dom,
            fileinfo, pcntl, tokenizer
          coverage: xdebug
          ini-values: |
            memory_limit=512M
            max_execution_time=120

      # ── 3. Cache Composer ─────────────────────────────────────────────────────
      - name: 📦 Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ matrix.php }}-
            composer-

      # ── 4. Install Composer dependencies ─────────────────────────────────────
      - name: 📥 Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      # ── 5. Setup Node (LTS) ──────────────────────────────────────────────────
      - name: 🟩 Setup Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      # ── 6. Cache Node modules ─────────────────────────────────────────────────
      - name: 📦 Cache Node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-

      # ── 7. Install NPM dependencies ───────────────────────────────────────────
      - name: 📥 Install NPM dependencies
        run: npm install

      # ── 8. Build frontend assets ──────────────────────────────────────────────
      - name: 🔨 Build frontend assets
        run: npm run build
        continue-on-error: true

      # ── 9. Prepare CI environment ─────────────────────────────────────────────
      - name: ⚙️ Prepare CI environment
        run: |
          cp .env.ci .env
          touch database/database.sqlite

      # ── 10. Generate APP_KEY ──────────────────────────────────────────────────
      - name: 🔑 Generate APP_KEY
        run: php artisan key:generate --force

      # ── 11. Run migrations ────────────────────────────────────────────────────
      - name: 🗄️ Run database migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/database.sqlite

      # ── 12. Clear caches ──────────────────────────────────────────────────────
      - name: 🧹 Clear application caches
        run: |
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear

      # ── 13. Execute tests with coverage ──────────────────────────────────────
      - name: 🧪 Execute PHPUnit tests
        run: |
          php artisan test \
            --coverage-clover=storage/logs/coverage.xml \
            --log-junit=storage/logs/junit.xml \
            --colors=always
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
          SESSION_DRIVER: array
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          TURNSTILE_ENABLED: false
          HONEYPOT_ENABLED: false
          MONITORING_ENABLED: false

      # ── 14. Publish JUnit report ──────────────────────────────────────────────
      - name: 📊 Publish JUnit test results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: "storage/logs/junit.xml"
          check_name: "PHPUnit Test Results (PHP ${{ matrix.php }})"
          fail_on_failure: true
          require_tests: true

      # ── 15. Upload artifacts ──────────────────────────────────────────────────
      - name: 📤 Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-php${{ matrix.php }}
          path: |
            storage/logs/junit.xml
            storage/logs/coverage.xml
          retention-days: 30

      # ── 16. Upload coverage to Codecov ────────────────────────────────────────
      - name: 📈 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: success()
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          file: storage/logs/coverage.xml
          flags: unittests
          name: hafrose-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2 — Build validation summary
  # ─────────────────────────────────────────────────────────────────────────────
  ci-summary:
    name: ✅ CI Summary
    runs-on: ubuntu-latest
    needs: [tests]
    if: always()

    steps:
      - name: 🎉 CI passed
        if: needs.tests.result == 'success'
        run: |
          echo "✅ All CI checks passed!"
          echo "PHP 8.3 tests: ${{ needs.tests.result }}"

      - name: ❌ CI failed
        if: needs.tests.result != 'success'
        run: |
          echo "❌ CI checks failed!"
          echo "PHP 8.3 tests: ${{ needs.tests.result }}"
          exit 1
