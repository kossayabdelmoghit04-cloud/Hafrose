name: 🔒 Security Analysis — HAFROSE

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # Run security scan every day at 03:00 UTC
    - cron: "0 3 * * *"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1 — Composer Security Audit
  # ─────────────────────────────────────────────────────────────────────────────
  composer-security:
    name: 📦 Composer Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, json
          coverage: none

      - name: 📥 Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: 🔍 Run Composer audit (vulnerabilities)
        run: |
          echo "=== Composer Security Audit ==="
          composer audit || {
            echo "❌ Vulnerable packages detected!"
            exit 1
          }

      - name: 📤 Upload audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: composer-audit-results
          path: composer.lock
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2 — Secret Detection
  # ─────────────────────────────────────────────────────────────────────────────
  secret-detection:
    name: 🔑 Secret & Sensitive Data Detection
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Scan for accidentally committed .env files
        run: |
          echo "=== Scanning for committed .env files ==="
          FOUND=0

          # Check for .env files in git history
          if git log --all --full-history -- ".env" | grep -q "commit"; then
            echo "⚠️  WARNING: .env file detected in git history"
            FOUND=1
          fi

          # Check for .env in current working tree (should be gitignored)
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "❌ CRITICAL: .env file is tracked by git!"
            FOUND=1
          fi

          # Check .env.* patterns (except .env.example, .env.ci)
          for f in $(git ls-files | grep "^\.env" | grep -v "\.env\.example" | grep -v "\.env\.ci"); do
            echo "❌ CRITICAL: Sensitive env file tracked: $f"
            FOUND=1
          done

          if [ $FOUND -eq 0 ]; then
            echo "✅ No committed .env files detected"
          fi

      - name: 🔍 Scan for hardcoded secrets patterns
        run: |
          echo "=== Scanning for hardcoded secrets ==="
          FOUND=0

          # Patterns to detect
          declare -a PATTERNS=(
            "APP_KEY=base64:"
            "DB_PASSWORD=[^=\n\r]"
            "SECRET_KEY="
            "AWS_SECRET_ACCESS_KEY=[A-Za-z0-9+/]"
            "STRIPE_SECRET="
            "password\s*=\s*['\"][^'\"]{8,}"
            "api_key\s*=\s*['\"][^'\"]{16,}"
          )

          for PATTERN in "${PATTERNS[@]}"; do
            RESULTS=$(git grep -rn --include="*.php" -E "$PATTERN" -- app/ config/ routes/ 2>/dev/null || true)
            if [ -n "$RESULTS" ]; then
              echo "⚠️  Potential hardcoded secret found (pattern: $PATTERN):"
              echo "$RESULTS"
              FOUND=1
            fi
          done

          if [ $FOUND -eq 0 ]; then
            echo "✅ No hardcoded secrets detected in PHP files"
          fi
        continue-on-error: true

      - name: 🔍 Verify .gitignore protects sensitive files
        run: |
          echo "=== Verifying .gitignore rules ==="
          REQUIRED_PATTERNS=(
            ".env"
            "storage/logs"
            "vendor"
            "node_modules"
            ".phpunit.result.cache"
          )

          MISSING=0
          for PATTERN in "${REQUIRED_PATTERNS[@]}"; do
            if ! grep -qF "$PATTERN" .gitignore 2>/dev/null; then
              echo "⚠️  Missing from .gitignore: $PATTERN"
              MISSING=1
            else
              echo "✅ Protected: $PATTERN"
            fi
          done

          if [ $MISSING -eq 1 ]; then
            echo "⚠️  Some sensitive paths are not protected in .gitignore"
          else
            echo "✅ All critical paths are properly gitignored"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3 — PHP Security Scan
  # ─────────────────────────────────────────────────────────────────────────────
  php-security-scan:
    name: 🛡️ PHP Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, json
          coverage: none

      - name: 📥 Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: 🛡️ Install & Run PHP Security Checker
        run: |
          # Try local-php-security-checker
          if command -v local-php-security-checker &>/dev/null; then
            local-php-security-checker
          else
            echo "Running composer audit as alternative..."
            composer audit --format=plain || true
          fi

      - name: 🔍 Check PHP version compliance
        run: |
          PHP_VERSION=$(php -r "echo PHP_VERSION;")
          echo "PHP Version: $PHP_VERSION"

          # Ensure PHP 8.3+
          if php -r "exit(version_compare(PHP_VERSION, '8.3.0', '>=') ? 0 : 1);"; then
            echo "✅ PHP version $PHP_VERSION meets minimum requirement (8.3+)"
          else
            echo "❌ PHP version $PHP_VERSION does not meet minimum requirement (8.3+)"
            exit 1
          fi

      - name: 🔍 Detect dangerous PHP functions
        run: |
          echo "=== Scanning for dangerous PHP functions ==="
          DANGEROUS=(
            "eval("
            "exec("
            "system("
            "passthru("
            "shell_exec("
            "base64_decode(.*eval"
            "preg_replace.*\/e"
          )

          FOUND=0
          for FUNC in "${DANGEROUS[@]}"; do
            RESULTS=$(grep -rn --include="*.php" "$FUNC" app/ 2>/dev/null || true)
            if [ -n "$RESULTS" ]; then
              echo "⚠️  Potentially dangerous function detected: $FUNC"
              echo "$RESULTS"
              FOUND=1
            fi
          done

          if [ $FOUND -eq 0 ]; then
            echo "✅ No dangerous PHP functions detected in app/"
          fi
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4 — Security Summary
  # ─────────────────────────────────────────────────────────────────────────────
  security-summary:
    name: 🔐 Security Summary
    runs-on: ubuntu-latest
    needs: [composer-security, secret-detection, php-security-scan]
    if: always()

    steps:
      - name: 📊 Security scan summary
        run: |
          echo "=== HAFROSE Security Analysis Summary ==="
          echo "Composer Audit:         ${{ needs.composer-security.result }}"
          echo "Secret Detection:       ${{ needs.secret-detection.result }}"
          echo "PHP Security Scan:      ${{ needs.php-security-scan.result }}"

          if [[ "${{ needs.composer-security.result }}" == "failure" ]]; then
            echo "❌ Critical: Vulnerable composer packages detected!"
            exit 1
          fi

          echo "✅ Security analysis completed"
