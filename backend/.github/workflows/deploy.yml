name: 🚀 Deploy — HAFROSE Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment target"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging
      dry_run:
        description: "Dry run (no actual deployment)"
        required: false
        default: false
        type: boolean
      rollback:
        description: "Force rollback to previous version"
        required: false
        default: false
        type: boolean

  release:
    types:
      - published

permissions:
  contents: read
  deployments: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1 — Pre-deployment validation
  # ─────────────────────────────────────────────────────────────────────────────
  pre-deploy-checks:
    name: 🔎 Pre-deployment Checks
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐘 Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, json, xml
          coverage: none

      - name: 📥 Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: ✅ Validate composer.json
        run: composer validate --strict

      - name: 🔍 Run security audit
        run: composer audit || true

      - name: 🔍 Check PHP syntax
        run: find app/ -name "*.php" -exec php -l {} \; | grep -v "^No syntax errors"
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2 — Deploy to Production
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to ${{ github.event.inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    needs: [pre-deploy-checks]
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: 📋 Deployment info
        run: |
          echo "==================================="
          echo "🚀 HAFROSE Deployment"
          echo "==================================="
          echo "Environment: ${{ github.event.inputs.environment || 'production' }}"
          echo "Dry Run:     ${{ github.event.inputs.dry_run || 'false' }}"
          echo "Rollback:    ${{ github.event.inputs.rollback || 'false' }}"
          echo "Commit:      ${{ github.sha }}"
          echo "Branch:      ${{ github.ref_name }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "==================================="

      - name: 🔄 Rollback to previous release
        if: github.event.inputs.rollback == 'true'
        run: |
          echo "⏪ Rolling back to previous release..."
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && \
             git log --oneline -5 && \
             git stash && \
             git checkout HEAD~1 -- . && \
             php artisan config:clear && \
             php artisan cache:clear && \
             php artisan optimize && \
             echo '✅ Rollback complete'"
        continue-on-error: false

      - name: 🔧 Enable maintenance mode
        if: github.event.inputs.dry_run != 'true' && github.event.inputs.rollback != 'true'
        run: |
          echo "🔧 Enabling maintenance mode..."
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && \
             php artisan down --secret='${{ secrets.MAINTENANCE_SECRET }}' \
               --message='Mise à jour en cours. Retour dans quelques minutes.' \
               --retry=60 || echo 'Maintenance mode already active'"

      - name: 📥 Pull latest code
        if: github.event.inputs.dry_run != 'true' && github.event.inputs.rollback != 'true'
        run: |
          echo "📥 Pulling latest code..."
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && \
             git fetch origin && \
             git reset --hard origin/${{ github.ref_name }} && \
             echo '✅ Code updated to: $(git log --oneline -1)'"

      - name: 📦 Install production dependencies
        if: github.event.inputs.dry_run != 'true' && github.event.inputs.rollback != 'true'
        run: |
          echo "📦 Installing production dependencies..."
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && \
             composer install \
               --no-dev \
               --prefer-dist \
               --no-interaction \
               --optimize-autoloader \
               --no-progress"

      - name: 🟩 Build frontend assets
        if: github.event.inputs.dry_run != 'true' && github.event.inputs.rollback != 'true'
        run: |
          echo "🟩 Building frontend assets..."
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && \
             npm ci --prefer-offline && \
             npm run build && \
             echo '✅ Frontend built successfully'"

      - name: 🗄️ Run database migrations
        if: github.event.inputs.dry_run != 'true' && github.event.inputs.rollback != 'true'
        run: |
          echo "🗄️ Running database migrations..."
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && \
             php artisan migrate --force && \
             echo '✅ Migrations completed'"

      - name: ⚡ Optimize application
        if: github.event.inputs.dry_run != 'true' && github.event.inputs.rollback != 'true'
        run: |
          echo "⚡ Optimizing application..."
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && \
             php artisan config:cache && \
             php artisan route:cache && \
             php artisan view:cache && \
             php artisan event:cache && \
             php artisan icons:cache 2>/dev/null || true && \
             echo '✅ Application optimized'"

      - name: 💾 Run post-deploy backup
        if: github.event.inputs.dry_run != 'true' && github.event.inputs.rollback != 'true'
        run: |
          echo "💾 Running post-deployment backup..."
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && \
             php artisan hafrose:backup --type=database 2>/dev/null || \
             echo '⚠️  Backup skipped (command not available)'"
        continue-on-error: true

      - name: ✅ Bring application online
        if: github.event.inputs.dry_run != 'true' && github.event.inputs.rollback != 'true'
        run: |
          echo "✅ Bringing application online..."
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && \
             php artisan up && \
             echo '✅ Application is live!'"

      - name: 🏥 Health check
        if: github.event.inputs.dry_run != 'true'
        run: |
          echo "🏥 Running health check..."
          sleep 5
          HEALTH_URL="${{ secrets.APP_URL }}/api/health"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" 2>/dev/null || echo "000")
          echo "Health check response: $HTTP_CODE"

          if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 404 ]; then
            echo "✅ Application is responding"
          else
            echo "⚠️  Health check returned: $HTTP_CODE"
          fi
        continue-on-error: true

      - name: 🔄 Emergency rollback on failure
        if: failure() && github.event.inputs.dry_run != 'true'
        run: |
          echo "🚨 Deployment FAILED — initiating emergency rollback..."
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && \
             git stash 2>/dev/null || true && \
             git checkout HEAD~1 -- . 2>/dev/null || true && \
             composer install --no-dev --optimize-autoloader --no-interaction 2>/dev/null || true && \
             php artisan config:cache 2>/dev/null || true && \
             php artisan up && \
             echo '⚠️  Emergency rollback completed'" || true

      - name: 📤 Notify deployment result
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            echo "🎉 Deployment to ${{ github.event.inputs.environment || 'production' }} SUCCEEDED"
          else
            echo "❌ Deployment to ${{ github.event.inputs.environment || 'production' }} FAILED"
          fi

      - name: 🏁 Dry run summary
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "==================================="
          echo "🔍 DRY RUN COMPLETED"
          echo "==================================="
          echo "No actual deployment was performed."
          echo "All pre-deployment checks passed."
          echo "The pipeline is ready for production deployment."
          echo "==================================="
