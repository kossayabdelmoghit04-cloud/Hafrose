# ==============================================================================
# HAFROSE Backend — Supervisor Queue Worker Configuration
# ==============================================================================
# Target OS: Ubuntu 24.04 LTS
# Target Path: /etc/supervisor/conf.d/hafrose-worker.conf
# Command to apply: supervisorctl reread && supervisorctl update && supervisorctl start hafrose-worker:*
# ==============================================================================

[program:hafrose-worker]

# ------------------------------------------------------------------------------
# Executable Command & Process Identification
# ------------------------------------------------------------------------------
# Command to execute Laravel queue worker processing.
# Options:
#   database        : Driver connection matching QUEUE_CONNECTION env variable.
#   --sleep=3       : Sleep time (in seconds) when no new jobs are available in queue.
#   --tries=3       : Maximum number of retry attempts for a failing job before moving to failed_jobs.
#   --max-time=3600 : Maximum duration (in seconds) a worker process runs before exiting cleanly to avoid memory leaks.
#   --timeout=90    : Maximum allowable execution time for an individual queued job.
command=php /var/www/hafrose/backend/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --timeout=90

# Formats the name of each process when spawning multiple instances.
# Results in process names: hafrose-worker_00, hafrose-worker_01, hafrose-worker_02, hafrose-worker_03
process_name=%(program_name)s_%(process_num)02d

# Number of parallel queue worker processes to manage.
# Scaled to 4 concurrent processes for optimal background job execution throughput.
numprocs=4

# Directory location from which the command is executed.
directory=/var/www/hafrose/backend

# User context under which worker processes are spawned.
user=www-data

# ------------------------------------------------------------------------------
# Lifecycle & Restart Policy
# ------------------------------------------------------------------------------
# Start automatically when Supervisor daemon starts up or system reboots.
autostart=true

# Restart automatically if the process exits unexpectedly or fails (returns non-zero exit code).
autorestart=true

# Number of failed start retries before Supervisor marks process as FATAL.
startretries=3

# Graceful termination period (in seconds) before Supervisor sends SIGKILL.
# CRITICAL: Set to 3600 to ensure active jobs have up to 1 hour to complete before hard termination.
stopwaitsecs=3600

# Send SIGTERM signal to entire process group on shutdown/reload.
stopasgroup=true
killasgroup=true

# ------------------------------------------------------------------------------
# Logging & Output Streams
# ------------------------------------------------------------------------------
# Standard Output (stdout) Log Configuration
stdout_logfile=/var/www/hafrose/backend/storage/logs/supervisor-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

# Standard Error (stderr) Log Configuration
stderr_logfile=/var/www/hafrose/backend/storage/logs/supervisor-worker-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

# Redirect stderr to stdout log (Set false to keep separate error log file)
redirect_stderr=false
