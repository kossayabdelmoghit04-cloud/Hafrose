services:
  # ── MySQL Database ─────────────────────────────────────────────────────────
  db:
    image: mysql:8.0.41
    restart: unless-stopped
    env_file:
      - path: ${PRODUCTION_ENV_FILE:-./.env.production}
        required: true
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - db_data:/var/lib/mysql
      - ./deployment/mysql/healthcheck.sh:/usr/local/bin/hafrose-mysql-healthcheck:ro
    networks:
      - data
    healthcheck:
      test: ["CMD", "/bin/sh", "/usr/local/bin/hafrose-mysql-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── Laravel API Backend ────────────────────────────────────────────────────
  backend:
    image: ${BACKEND_IMAGE_REPOSITORY:-hafrose-backend}:${IMAGE_TAG:?IMAGE_TAG must be an immutable commit SHA}
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    env_file:
      - path: ${PRODUCTION_ENV_FILE:-./.env.production}
        required: true
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:?APP_URL is required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
    volumes:
      - backend_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app
      - data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run:size=16m
      - /var/www/html/bootstrap/cache:size=32m,uid=82,gid=82,mode=0770
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "php", "artisan", "hafrose:healthcheck", "--quiet"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    command: ["php-fpm", "-F"]

  # ── Laravel Queue Worker ───────────────────────────────────────────────────
  worker:
    image: ${BACKEND_IMAGE_REPOSITORY:-hafrose-backend}:${IMAGE_TAG:?IMAGE_TAG must be an immutable commit SHA}
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    env_file:
      - path: ${PRODUCTION_ENV_FILE:-./.env.production}
        required: true
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:?APP_URL is required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - backend_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - app
      - data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/www/html/bootstrap/cache:size=32m,uid=82,gid=82,mode=0770
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    command: ["php", "artisan", "queue:work", "database", "--sleep=3", "--tries=3", "--max-time=3600", "--timeout=90"]

  # ── React SPA Frontend ─────────────────────────────────────────────────────
  scheduler:
    image: ${BACKEND_IMAGE_REPOSITORY:-hafrose-backend}:${IMAGE_TAG:?IMAGE_TAG must be an immutable commit SHA}
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    env_file:
      - path: ${PRODUCTION_ENV_FILE:-./.env.production}
        required: true
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
    volumes:
      - backend_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks: [app, data]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/www/html/bootstrap/cache:size=32m,uid=82,gid=82,mode=0770
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    command: ["php", "artisan", "schedule:work", "--no-interaction"]

  frontend:
    image: ${FRONTEND_IMAGE_REPOSITORY:-hafrose-frontend}:${IMAGE_TAG:?IMAGE_TAG must be an immutable commit SHA}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_STORAGE_URL: ${VITE_STORAGE_URL:-/storage}
        VITE_APP_ENV: production
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:?VITE_TURNSTILE_SITE_KEY is required}
    restart: unless-stopped
    networks:
      - app
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=16m
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Nginx Reverse Proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27.4-alpine3.21
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:?BIND_ADDRESS is required}:80:80"
      - "${BIND_ADDRESS:?BIND_ADDRESS is required}:443:443"
    volumes:
      - ./deployment/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deployment/nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
      - ./deployment/ssl:/etc/nginx/ssl:ro
      - backend_storage:/var/www/html/storage:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - app
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=16m
      - /tmp:size=16m
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--no-check-certificate", "-O", "/dev/null", "https://127.0.0.1/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  db_data:
    driver: local
  backend_storage:
    driver: local
networks:
  app:
    driver: bridge
  data:
    driver: bridge
    internal: true
